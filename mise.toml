# Local CI toolchain (ADR-0027). Pinned versions, checksums in mise.lock.
# Python, the project venv and sonar-scanner stay outside mise.
[tools]
just = "1.59.0"
lefthook = "2.2.2"
"aqua:astral-sh/ruff" = "0.17.3"
"pipx:mypy" = { version = "2.4.0", uvx_args = "--with types-PyYAML" }
typos = "1.51.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
gitleaks = "8.30.1"
osv-scanner = "2.7.0"
"pipx:semgrep" = "1.182.1"

[settings]
lockfile = true
