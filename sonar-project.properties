# SonarQube project configuration — shared local Community Build (http://localhost:9000).
# The analysis token is read from the SONAR_TOKEN environment variable; never commit it.
# Run with `make sonar`. Community Build analyses main only (no PR decoration).

sonar.projectKey=aristech
sonar.projectName=aristech
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml

# Legacy Keras package, slated for removal (audit 2026-10-15, finding S3).
sonar.exclusions=src/aristech/training/**
sonar.coverage.exclusions=src/aristech/training/**
