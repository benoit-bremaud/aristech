name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install ruff mypy types-PyYAML
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy --config-file=pyproject.toml src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install pytest pytest-cov pyyaml python-dotenv
      - name: Run unit tests (no hardware, no models)
        run: PYTHONPATH=src pytest tests/unit -q --cov=aristech --cov-report=term-missing
