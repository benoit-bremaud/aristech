name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy types-PyYAML
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy --config-file=pyproject.toml src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Install the package so `aristech.*` imports as in production. tests/unit uses fakes at
      # the ports and needs no heavy dependency (torch), so only what the tests import is installed.
      - run: pip install -e . --no-deps
      - run: pip install pytest pytest-cov pyyaml python-dotenv opencv-python-headless numpy
      - name: Run tests (default selection, no hardware, no models)
        run: pytest -q --cov=aristech --cov-report=term-missing
