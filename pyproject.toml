[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aristech"
version = "0.1.0"
description = "aristech: real-time detection of the Asian hornet (Vespa velutina) in front of beehives."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Benoit Bremaud", email = "benoit.bremaud@vev.com" }]
keywords = [
    "asian-hornet",
    "vespa-velutina",
    "detection",
    "computer-vision",
    "iot",
    "beekeeping",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
]

# The core stays light on purpose: only what the domain, the use cases and the
# composition root (CLI) need. Anything heavy or adapter-specific (vision) lives in
# an optional extra (ADR-0001). The full lock is requirements.txt (`make lock`).
dependencies = [
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
# Vision adapters (M2): OpenCVVideoSource + VespAIDetector (YOLOv5).
# VespAI weights are CC BY-NC-SA and NOT bundled: they are loaded from a given path.
# torch/yolov5 are BSD/AGPL: wrapped at runtime, never copied into aristech.
vision = [
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
    "opencv-python>=4.9,<5",
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "Pillow>=13.0,<14",
]
# Pre-field model training and scoring (ADR-0022, ADR-0024): RF-DETR, Apache-2.0 code and
# Nano-Large weights (only Small is used). Checkpoints stay git-ignored, loaded from a path.
train = [
    "rfdetr[train]==1.11.2",
]
# Capture rig (C1, ADR-0017): I²S audio + Picamera2. On Raspberry Pi OS install picamera2 from
# apt (python3-picamera2, needs libcamera) and create the venv with --system-site-packages.
capture = [
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
    "numpy>=1.26,<2",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pip-tools",
]
# GPU extra isolated: NVIDIA wheels exist for Linux x86_64 only. The PEP 508
# markers stop the install from resolving them on macOS / Windows / ARM.
gpu = [
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
aristech = "aristech.interface.cli.main:main"
aristech-record = "aristech.interface.cli.record:main"

[project.urls]
Homepage = "https://github.com/benoit-bremaud/aristech"
Issues = "https://github.com/benoit-bremaud/aristech/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not integration and not e2e\""
markers = [
    "integration: tests that touch hardware, real data or the network",
    "e2e: end-to-end tests (slow)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["aristech"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# Libraries without (complete) stubs, tolerated so strict mypy stays usable.
module = [
    "cv2",
    "picamera2.*",
    "sounddevice",
    "soundfile",
    "dotenv",
    "numpy.*",
    "pandas.*",
    "PIL.*",
    "rfdetr",
    "torch.*",
    "yaml",
]
ignore_missing_imports = true

# Infrastructure: adapters over untyped libraries (cv2, torch, YOLOv5). Domain and
# application stay strict; only the layer touching the outside world is relaxed.
[[tool.mypy.overrides]]
module = ["aristech.infrastructure.*"]
warn_return_any = false
